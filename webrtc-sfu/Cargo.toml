[package]
name = "webrtc-sfu"
version = "0.1.0"
edition = "2021"

[dependencies]
str0m = "0.24.1"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
